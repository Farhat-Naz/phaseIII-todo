version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

# Environment variables that should be set in Amplify Console:
# NEXT_PUBLIC_API_URL - Your AWS Lambda API Gateway URL
# Example: https://xxxxxxxxxx.execute-api.us-east-1.amazonaws.com/Prod
