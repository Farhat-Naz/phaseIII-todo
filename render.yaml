services:
  - type: web
    name: phaseii-todo-backend
    env: python
    runtime: python-3.11.0
    rootDir: backend
    region: singapore
    plan: free
    branch: 008-mcp-chatbot
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_MODEL
        value: gpt-4o
      - key: ENV
        value: production
      - key: DEBUG
        value: False
